{% extends 'main/layout.html' %}

{% block title %} Form to add article {% endblock %}

{% block content %}
    <div class="features">
        <h1>Form to add article</h1>
        <form method="post">
            {% csrf_token %}
            <input type="text" placeholder="Article name" class="form-control"><br>
            <input type="text" placeholder="Article anons" class="form-control"><br>
            <textarea class="form-control" placeholder="article text"></textarea><br>
            <input type="date" class="form-control"><br>
            <input type="time" class="form-control"><br>
            <button class="btn btn-success" type="submit">Add article</button>
        </form>
    </div>
    
{% endblock %}
